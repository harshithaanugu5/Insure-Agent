version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
  frontend:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app
    command: streamlit run frontend/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
